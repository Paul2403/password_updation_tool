<div class="main">
    <div class="container">
        <form [formGroup]="passwordAuthForm">
        <div class="row col-md-12">
            <div class="col-md-6">
                <!-- <div class="form-group"> -->
                    <label for="">Email</label>
                    <input type="email" id="email" class="form-control" formControlName="fEmail" >
                <!-- </div> -->
            </div>
            <div class="col-md-6">
                <!-- <div class="form-group"> -->
                    <label for="">Current Password</label>
                    <input type="{{ showCurrentPassword ? 'text' : 'password' }}" [(ngModel)]="currentPassword" maxlength="25"  formControlName="fCurrentPassword">
                    <i class="far fa-eye" id="togglePassword" style="margin-left: -40px; margin-top: 14px; cursor: pointer;position:absolute" (click)="togglePasswordType(1)" ></i>
                <!-- </div> -->
            </div>
        </div>
        <div class="row col-md-12">
            <div class="col-md-6">
                <!-- <div class="form-group"> -->
                    <label for="">New Password</label>
                    <input type="password" id="newPassword"  type="{{ showNewPassword ? 'text' : 'password' }}" [(ngModel)]="newPassword" (ngModelChange)="countChars($event)" maxlength="25"  formControlName="fNewPassword">
                    <i class="far fa-eye" id="togglePassword" style="margin-left: -40px; margin-top: 14px; cursor: pointer;position:absolute" (click)="togglePasswordType(2)"></i>
                <!-- </div> -->
            </div>
            <div class="col-md-6">
                <!-- <div class="form-group"> -->
                    <label for="">Confirm New Password</label>
                <input type="password" id="newPassword"  type="{{ showRetypeNewPassword ? 'text' : 'password' }}" [(ngModel)]="retypeNewPassword" maxlength="25"  formControlName="fConfirmPassword">
                <i class="far fa-eye" id="togglePassword" style="margin-left: -40px; margin-top: 14px; cursor: pointer;position:absolute" (click)="togglePasswordType(3)"></i>
                <!-- </div> -->
                
            </div>
        </div>
        <div class="col-md-12">
            <label for="">Power password</label>
            <div class="power-container">
                <div id="power-point"></div>
            </div>
            <br/>
            <div class="generate_button chars_holder">
                <p id="charNum">0 characters containing:</p>
                <div class="char_type" > 
                    <span class="char_type_text" style="padding-right:16px;color: #5b6262;" id="special_count">Symbols</span>
                </div>
                <div class="char_type"> 
                    <span class="char_type_text" style="padding-right:13px;color: #5b6262;" id="digits_count" >Numbers</span>
                </div>
                <div class="char_type" > 
                    <span class="char_type_text" style="color: #5b6262;"  id="upper_count">Upper case</span>
                </div>
                <div class="char_type char_type_valid" > 
                    <span class="char_type_text" style="color: #5b6262;" id="lower_count">Lower case</span>
                </div>
                <div class="char_type char_type_valid" > 
                    <span class="char_type_text" style="color: #5b6262;" id="common_passwd">Error Message!</span>
                </div>
                <div class="breaker"> &nbsp;
    
                </div>
                <!-- <div class="col-md-12">
                    <button type="button" class="btn btn-info submit-bttn">Info</button>
                </div> -->
                <div class="col-md-12 text-center">
                    <div class="d-inline-block">
                      <button class="btn btn-primary submit-bttn" (click)="updatePassword()">Update Password</button>
                    </div>
                  </div>
                <div id="banner" class="banner"><span style="font-size: 24px;">&#9888;</span> {{errMsg}}</div>
            </div>
        </div>
    </form>
    </div>
</div>

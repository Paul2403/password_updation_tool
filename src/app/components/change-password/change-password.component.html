<div class="main">
    <div class="group">
        <label for="">Email</label>
        <input type="email" id="email" >
        <label for="">Current Password</label>
        <input type="{{ showCurrentPassword ? 'text' : 'password' }}" [(ngModel)]="currentPassword">
        <i class="far fa-eye" id="togglePassword" style="margin-left: -40px; margin-top: 25px; cursor: pointer;position:absolute" (click)="togglePasswordType(1)"></i>
        <label for="">New Password</label>
        <input type="password" id="newPassword"  type="{{ showNewPassword ? 'text' : 'password' }}" [(ngModel)]="newPassword" (ngModelChange)="countChars($event)">
        <i class="far fa-eye" id="togglePassword" style="margin-left: -40px; margin-top: 25px; cursor: pointer;position:absolute" (click)="togglePasswordType(2)"></i>
        <label for="">Confirm New Password</label>
        <input type="password" id="newPassword"  type="{{ showRetypeNewPassword ? 'text' : 'password' }}" [(ngModel)]="retypeNewPassword" >
        <i class="far fa-eye" id="togglePassword" style="margin-left: -40px; margin-top: 25px; cursor: pointer;position:absolute" (click)="togglePasswordType(3)"></i>
        <label for="">Power password</label>
        <div class="power-container">
            <div id="power-point"></div>
        </div>
        <br/>
        <div class="generate_button chars_holder">
            <p id="charNum">0 characters containing:</p>
            <div class="char_type" > 
                <span class="char_type_text" style="padding-right:16px;color: #5b6262;" id="special_count">Symbols</span>
            </div>
            <div class="char_type"> 
                <span class="char_type_text" style="padding-right:13px;color: #5b6262;" id="digits_count" >Numbers</span>
            </div>
            <div class="char_type" > 
                <span class="char_type_text" style="color: #5b6262;"  id="upper_count">Upper case</span>
            </div>
            <div class="char_type char_type_valid" > 
                <span class="char_type_text" style="color: #5b6262;" id="lower_count">Lower case</span>
            </div>
            <div class="breaker"> &nbsp;

            </div>
            <div id="banner" class="banner"><span style="font-size: 24px;">&#9888;</span> Commonly Used Password!</div>
        </div>
    </div>
</div>
